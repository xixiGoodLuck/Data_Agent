[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "insightops-agent-backend"
version = "0.1.0"
description = "InsightOps Agent API and data-analysis workflow"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<0.22",
  "fastapi>=0.115,<0.117",
  "langchain-core>=0.3.45,<0.4",
  "langchain-openai>=0.3.8,<0.4",
  "langgraph>=0.3.5,<0.7",
  "langgraph-checkpoint-sqlite>=2.0.6,<3",
  "numpy>=2.1,<3",
  "openpyxl>=3.1.5,<4",
  "packaging>=24,<26",
  "pandas>=2.2.3,<2.4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dateutil>=2.9,<3",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy>=2.0.37,<2.1",
  "sqlglot>=26.8,<28",
  "uvicorn[standard]>=0.34,<0.36",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<0.27",
  "ruff>=0.9,<0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501", "SIM118", "UP038"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
